<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assetra Digital v2 — web a e-shop bez vstupní investice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Geist:wght@400..700&amp;family=JetBrains+Mono:wght@400..700&amp;display=swap">
<style>
body{margin:0;background:#070808}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.x{--disp:"Archivo","Arial Narrow","Roboto Condensed",sans-serif;--sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--ease:cubic-bezier(.16,1,.3,1);position:relative;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background .6s,color .6s}
.x[data-theme="dark"]{--bg:#070808;--bg2:#0d0f0f;--fg:#eef2f0;--fg2:#a9b0ac;--fg3:#8a918d;--dim:#3c413e;--line:rgba(238,242,240,.09);--line2:rgba(238,242,240,.18);--grid:rgba(238,242,240,.04);--acc:#5ff5c4;--acc2:#7cc8ff;--accInk:#03130d;--accText:#5ff5c4;--gl1:rgba(255,255,255,.075);--gl2:rgba(255,255,255,.015);--glb:rgba(255,255,255,.12);--glh:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.75);--pc:238,242,240;color-scheme:dark}
.x[data-theme="light"]{--bg:#eef0ee;--bg2:#e4e7e4;--fg:#0b0d0c;--fg2:#3b413e;--fg3:#5a615d;--dim:#a7aca9;--line:rgba(11,13,12,.1);--line2:rgba(11,13,12,.22);--grid:rgba(11,13,12,.05);--acc:#2fe0a3;--acc2:#4a9eea;--accInk:#03130d;--accText:#057a56;--gl1:rgba(255,255,255,.7);--gl2:rgba(255,255,255,.35);--glb:rgba(255,255,255,.9);--glh:rgba(255,255,255,1);--shadow:rgba(20,40,30,.22);--pc:11,13,12;color-scheme:light}
.x *,.x *::before,.x *::after{box-sizing:border-box}
.x a{color:inherit;text-decoration:none}
.x ::selection{background:var(--acc);color:var(--accInk)}
.x :focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.grain{position:fixed;inset:-50%;z-index:60;pointer-events:none;opacity:.06;background-image:repeating-radial-gradient(circle at 17% 32%,rgba(255,255,255,.9) 0 .6px,transparent .6px 2.4px),repeating-radial-gradient(circle at 73% 68%,rgba(0,0,0,.9) 0 .6px,transparent .6px 2.1px);animation:grain .9s steps(3) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
.w{max-width:1380px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}
.todo{font-family:var(--mono);font-size:.78em;font-weight:500;color:var(--accText);border:1px dashed currentColor;border-radius:6px;padding:.08em .45em;white-space:nowrap}
.mono{font-family:var(--mono)}
.glass{background:linear-gradient(180deg,var(--gl1),var(--gl2));-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh),0 24px 60px -28px var(--shadow)}
.beam{position:relative;isolation:isolate}
.beam::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),transparent 0 62%,var(--acc) 80%,var(--acc2) 90%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 3.4s linear infinite;pointer-events:none}
@keyframes beam{to{--ang:360deg}}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 26px;border-radius:999px;font:600 14px/1 var(--sans);letter-spacing:.01em;border:1px solid var(--line2);color:var(--fg);background:transparent;overflow:hidden;cursor:pointer;transition:transform .5s var(--ease),background .3s,color .3s,border-color .3s}
.btn .t{position:relative;display:block;overflow:hidden;height:1.1em;line-height:1.1}
.btn .t span{display:block;transition:transform .45s var(--ease)}
.btn .t span+span{position:absolute;left:0;top:100%}
.btn:hover .t span{transform:translateY(-100%)}
.btn .ar{display:grid;place-items:center;width:28px;height:28px;margin-right:-12px;border-radius:50%;background:var(--accInk);color:var(--acc);font-style:normal;transition:transform .45s var(--ease)}
.btn:hover .ar{transform:rotate(-45deg)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:transparent;box-shadow:0 10px 40px -10px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn.gl{background:linear-gradient(180deg,var(--gl1),var(--gl2));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:var(--glb)}
.btn.gl:hover{border-color:var(--fg)}
@keyframes rise{from{opacity:0;transform:translateY(40px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes blink{0%,70%{opacity:1}72%,78%{opacity:.15}80%,100%{opacity:1}}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.rv{opacity:0}
[data-in="true"] .rv{animation:rise .9s var(--ease) both}
.ttl{clip-path:inset(0 0 100% 0);transform:translateY(30%)}
[data-in="true"] .ttl{animation:ttl 1s var(--ease) both}
@keyframes ttl{to{clip-path:inset(-10% -5% -15% -5%);transform:none}}

.cur{position:fixed;left:0;top:0;z-index:80;pointer-events:none;width:0;height:0;mix-blend-mode:difference}
.cur i{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:1.5px solid #fff;transition:transform .35s var(--ease),background .35s}
.cur b{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#fff}
.cur.big i{transform:scale(2.1);background:#fff}
@media (hover:none){.cur{display:none}}

.nav{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:8px;width:min(1180px,calc(100% - 24px));margin:12px auto 0;padding:7px 7px 7px 18px;border-radius:999px}
.prog{position:absolute;left:24px;right:24px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));transform-origin:left;transform:scaleX(0)}
.logo{display:flex;align-items:center;gap:11px;min-height:44px;margin-right:auto}
.mark{width:36px;height:27px;flex:none;color:var(--fg);overflow:visible}
.mark .px{fill:var(--acc);animation:blink 2.6s steps(1) infinite}
.wm{font:700 11px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase}
.links{display:flex;gap:2px}
.links a{display:flex;align-items:center;min-height:44px;padding:0 15px;border-radius:999px;font:500 14px/1 var(--sans);color:var(--fg2);transition:background .3s,color .3s}
.links a:hover{background:var(--line);color:var(--fg)}
.nav .btn{min-height:46px;padding:0 20px;font-size:13.5px}
.ib{appearance:none;display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;transition:background .3s}
.ib:hover{background:var(--line)}
.ib svg{width:20px;height:20px}
.mb{display:none}
.mb span{position:relative;width:18px;height:9px}
.mb span::before,.mb span::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .4s var(--ease),top .4s var(--ease)}
.mb span::before{top:0}
.mb span::after{top:7px}
.x[data-menu="open"] .mb span::before{top:3.5px;transform:rotate(45deg)}
.x[data-menu="open"] .mb span::after{top:3.5px;transform:rotate(-45deg)}
.menu{display:none;position:fixed;inset:0;z-index:45;flex-direction:column;justify-content:flex-end;gap:4px;padding:100px clamp(18px,5vw,40px) 40px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.x[data-menu="open"] .menu{display:flex}
.menu a.mi{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-family:var(--disp);font-stretch:68%;font-weight:850;font-size:clamp(46px,12vw,72px);line-height:1;text-transform:uppercase;animation:rise .7s var(--ease) both}
.menu a.mi small{font:500 12px/1 var(--mono);color:var(--fg3)}
.menu .btn{margin-top:24px;animation:rise .7s .25s var(--ease) both}

.hero{position:relative;margin-top:-72px;padding-top:72px;overflow:hidden}
.hgrid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:64px 64px;-webkit-mask:radial-gradient(ellipse 80% 70% at 60% 30%,#000 30%,transparent 75%);mask:radial-gradient(ellipse 80% 70% at 60% 30%,#000 30%,transparent 75%)}
.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(80px);opacity:.5}
.glow.g1{width:520px;height:520px;right:4%;top:60px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 60%,transparent),transparent 70%);animation:fl 9s ease-in-out infinite}
.glow.g2{width:380px;height:380px;right:28%;top:300px;background:radial-gradient(circle,color-mix(in srgb,var(--acc2) 55%,transparent),transparent 70%);animation:fl 11s -3s ease-in-out infinite}
.hin{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:24px;align-items:center;min-height:780px;padding-top:56px;padding-bottom:40px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;font:500 13px/1 var(--sans);color:var(--fg2);animation:rise .8s .1s var(--ease) both}
.pill b{padding:7px 10px;border-radius:999px;background:var(--acc);color:var(--accInk);font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.h1{margin:26px 0 24px;font-family:var(--disp);font-stretch:66%;font-weight:850;font-size:clamp(56px,8.4vw,136px);line-height:.93;letter-spacing:-.01em;text-transform:uppercase}
.h1 .wd{display:inline-block;white-space:nowrap;margin-right:.2em}
.h1 .c{display:inline-block;animation:chr .9s var(--ease) both}
@keyframes chr{from{opacity:0;transform:translateY(.6em) rotateX(-80deg);filter:blur(10px);font-stretch:125%}to{opacity:1;transform:none;filter:none;font-stretch:66%}}
.h1 .hl{background:linear-gradient(100deg,var(--acc),var(--acc2) 45%,var(--acc) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:chr .9s var(--ease) both,shine 4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.lead{margin:0;max-width:33em;font-size:clamp(17px,1.4vw,20px);line-height:1.55;color:var(--fg2)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.checks{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:30px 0 0;padding:0}
.checks li{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;font:500 13px/1 var(--sans);color:var(--fg2)}
.checks i{width:16px;height:16px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font:800 10px/1 var(--sans);font-style:normal}
.orb{position:relative;aspect-ratio:1/1;width:100%;max-width:640px;justify-self:center;cursor:grab}
.orb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.orb-l{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);white-space:nowrap}
.orb-l b{color:var(--accText);font-weight:500}
.stagew{position:relative;padding:20px 0 90px}
.dev{position:relative;container-type:inline-size;aspect-ratio:1200/720;width:min(1120px,100%);margin:0 auto}
.br{position:absolute;left:0;top:0;width:82%;border-radius:1.6cqw;background:#f3f1ec;color:#1b1c1a;overflow:hidden;border:1px solid var(--glb);box-shadow:0 6cqw 14cqw -6cqw var(--shadow),0 0 0 1px rgba(0,0,0,.06)}
.bt{display:flex;align-items:center;gap:.8cqw;padding:1cqw 1.4cqw;background:#e6e3dc;border-bottom:1px solid rgba(0,0,0,.08)}
.bt i{width:.9cqw;height:.9cqw;border-radius:50%;background:rgba(0,0,0,.18)}
.url{flex:1;max-width:40%;margin:0 auto;font:500 1.15cqw/1 var(--mono);color:#5d5f5b;background:#f6f4ef;border-radius:99px;padding:.7cqw 1.2cqw;text-align:center}
.sh{padding:1.8cqw 2.2cqw 2.2cqw}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:2cqw;font-size:1.3cqw}
.sh-logo{font-weight:800;font-size:2.1cqw;letter-spacing:-.02em}
.sh-nav{display:flex;gap:1.8cqw;color:#5d5f5b}
.cart{position:relative;font-weight:600;padding-right:1.3cqw}
.cart b{position:absolute;right:-1.1cqw;top:-1cqw;min-width:1.8cqw;height:1.8cqw;border-radius:99px;background:#1b1c1a;color:#f3f1ec;font:700 1cqw/1.8cqw var(--mono);text-align:center}
.sh-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw;margin:1.8cqw 0;padding:2.4cqw;border-radius:1cqw;background:radial-gradient(circle at 80% 20%,#3a3b33,#1f201c 60%);color:#f3f1ec}
.sh-hero b{display:block;max-width:60%;font-family:var(--disp);font-stretch:72%;font-weight:850;font-size:3.1cqw;line-height:1;text-transform:uppercase}
.sh-hero span{flex:none;font:600 1.1cqw/1 var(--mono);background:#f3f1ec;color:#1b1c1a;border-radius:99px;padding:.9cqw 1.4cqw}
.sh-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.3cqw}
.pt{display:flex;flex-direction:column;gap:.45cqw;font-size:1.1cqw;line-height:1.2}
.pt b{font-weight:600}
.pt span{color:#5d5f5b}
.tile{display:flex;justify-content:center;align-items:flex-end;height:11.5cqw;padding-bottom:1.2cqw;border-radius:.8cqw;background:radial-gradient(circle at 50% 30%,#f2eee6,#ddd6c8)}
.bag{position:relative;width:5.6cqw;height:8cqw;border-radius:.4cqw .4cqw .7cqw .7cqw;background-image:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,0) 38%,rgba(0,0,0,.3));box-shadow:0 1.1cqw 1.1cqw -.7cqw rgba(0,0,0,.55);transition:transform .5s var(--ease)}
.pt:hover .bag{transform:translateY(-.6cqw) rotate(-3deg)}
.bag::before{content:"";position:absolute;left:0;right:0;top:0;height:1cqw;border-radius:.4cqw .4cqw 0 0;background:rgba(0,0,0,.22)}
.bag::after{content:"";position:absolute;left:20%;right:20%;top:40%;height:32%;border-radius:.25cqw;background:#f4f0e6}
.add{font:600 .95cqw/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:#1b1c1a;border:1px solid rgba(0,0,0,.2);border-radius:99px;padding:.7cqw;text-align:center}
.ph{position:absolute;right:2%;bottom:-4%;width:24%;aspect-ratio:9/19;border-radius:3.6cqw;background:#0b0d0d;border:1px solid var(--glb);padding:.9cqw;box-shadow:0 5cqw 10cqw -4cqw var(--shadow),inset 0 0 0 1px rgba(255,255,255,.06);animation:fl 7s ease-in-out infinite}
.ph-s{height:100%;display:flex;flex-direction:column;gap:1cqw;overflow:hidden;border-radius:2.8cqw;background:linear-gradient(180deg,#141917,#0e1110);color:#e9eeeb;padding:3.2cqw 1.6cqw 1.4cqw}
.ph-t{display:flex;justify-content:space-between;align-items:baseline;font:700 1.75cqw/1 var(--sans)}
.ph-t small{font:500 .95cqw/1 var(--mono);color:#8d9692}
.ph-k{border-radius:1.2cqw;padding:1.2cqw;background:linear-gradient(135deg,rgba(95,245,196,.18),rgba(124,200,255,.08));border:1px solid rgba(95,245,196,.25)}
.ph-k small{display:block;font:500 .85cqw/1 var(--mono);color:#9fb3ab;text-transform:uppercase;letter-spacing:.08em}
.ph-k b{display:block;margin-top:.6cqw;font-family:var(--disp);font-stretch:78%;font-weight:850;font-size:2.5cqw;line-height:1}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.35cqw .7cqw;align-items:center;padding:.9cqw;border-radius:1cqw;background:rgba(233,238,235,.05);font-size:1cqw;line-height:1.2}
.o-n{font:500 .9cqw/1 var(--mono);color:#8d9692}
.o-a{font-weight:700;text-align:right}
.o-s{grid-column:2/4;justify-self:end;font:600 .8cqw/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:.4cqw .65cqw;border-radius:99px;background:rgba(233,238,235,.08);color:#b9c2be}
.o-s.ok{background:rgba(95,245,196,.15);color:#5ff5c4}
@keyframes rowA{from{opacity:0;transform:translateY(-1.2cqw) scale(.96);background:rgba(95,245,196,.25)}to{opacity:1;transform:none}}
@keyframes rowB{from{opacity:0;transform:translateY(-1.2cqw) scale(.96);background:rgba(95,245,196,.25)}to{opacity:1;transform:none}}
.row.na{animation:rowA 1.2s var(--ease) both}
.row.nb{animation:rowB 1.2s var(--ease) both}
.toast{position:absolute;right:12%;top:8%;width:30%;display:flex;gap:1cqw;align-items:center;padding:1.2cqw 1.3cqw;border-radius:1.6cqw;color:#e9eeeb;background:rgba(18,22,21,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(233,238,235,.16);box-shadow:0 3cqw 6cqw -2cqw rgba(0,0,0,.7);font-size:clamp(10px,1.1cqw,14px);line-height:1.3}
@keyframes toA{0%{opacity:0;transform:translateY(-2cqw) scale(.9)}8%,86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-.8cqw) scale(.98)}}
@keyframes toB{0%{opacity:0;transform:translateY(-2cqw) scale(.9)}8%,86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-.8cqw) scale(.98)}}
.toast.ta{animation:toA 3.6s var(--ease) both}
.toast.tb{animation:toB 3.6s var(--ease) both}
.toast i{flex:none;display:grid;place-items:center;width:2.6cqw;height:2.6cqw;border-radius:.8cqw;background:#5ff5c4;color:#03130d;font:800 1.4cqw/1 var(--sans);font-style:normal}
.toast b{display:block;font-weight:700}
.toast small{font:500 clamp(9px,.9cqw,12px)/1.3 var(--mono);color:#8d9692}
.fc{position:absolute;display:flex;align-items:center;gap:.8cqw;padding:.9cqw 1.2cqw;border-radius:1.2cqw;font:600 clamp(10px,1.15cqw,14px)/1.2 var(--sans);white-space:nowrap;animation:fl 6s ease-in-out infinite}
.fc small{display:block;font:500 clamp(9px,.9cqw,12px)/1.2 var(--mono);color:var(--fg3)}
.fc i{width:1cqw;height:1cqw;min-width:8px;min-height:8px;border-radius:50%;background:var(--acc);animation:ping 2s infinite}
.fc.f1{left:-3%;top:30%}
.fc.f2{left:4%;bottom:-2%;animation-delay:-2s}
.fc.f3{right:30%;top:-4%;animation-delay:-4s}
.bin{overflow:hidden;white-space:nowrap;padding:14px 0;font:400 12px/1 var(--mono);letter-spacing:.12em;color:var(--dim);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bin span{display:inline-block;animation:mq 150s linear infinite}
.tapes{position:relative;height:clamp(230px,26vw,360px);overflow:hidden}
.tape{position:absolute;left:-6%;right:-6%;top:50%;overflow:hidden;padding:clamp(12px,1.4vw,20px) 0}
.tape.a{z-index:2;background:var(--acc);color:var(--accInk);transform:translateY(-75%) rotate(-4deg);box-shadow:0 20px 60px -20px color-mix(in srgb,var(--acc) 60%,transparent)}
.tape.b{transform:translateY(-15%) rotate(3deg);background:var(--bg2);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.tr{display:flex;width:max-content;animation:mq 28s linear infinite}
.tape.b .tr{animation-direction:reverse;animation-duration:34s}
.tr span{display:flex;align-items:center;gap:.45em;padding-right:.45em;font-family:var(--disp);font-stretch:66%;font-weight:900;font-size:clamp(36px,5.4vw,82px);line-height:1;text-transform:uppercase;white-space:nowrap}
